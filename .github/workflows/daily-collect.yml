name: 보도자료 일일 수집

on:
  schedule:
    # 매일 KST 09:10 실행 (UTC 기준 00:10). GitHub Actions cron은 UTC 기준입니다.
    - cron: "10 0 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 함께 활성화 (Actions 탭에서 Run workflow)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 오늘자 보도자료 수집
        run: python scripts/collect.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "press-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 보도자료 자동 수집 $(date -u +'%Y-%m-%d')"
          git push
